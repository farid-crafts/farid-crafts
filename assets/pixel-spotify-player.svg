<text x="210" y="106" fill="#F0F2F8" font-family="monospace" font-size="24" font-weight="bold">MY SPOTIFY</text>
<text x="210" y="135" fill="#F0F2F8" font-family="monospace" font-size="24" font-weight="bold">PLAYLIST</text>
<text x="210" y="160" fill="#A9B4C8" font-family="monospace" font-size="13">A little soundtrack for building things.</text>
