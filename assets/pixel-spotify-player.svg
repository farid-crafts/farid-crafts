<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="252" viewBox="0 0 900 252" role="img" aria-labelledby="title desc">
<title id="title">Pixel playlist player</title><desc id="desc">An animated pixel-art music player. Click its image in the profile to open the Spotify playlist.</desc>
<defs>
