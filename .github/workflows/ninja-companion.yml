name: Generate pixel ninja companion GIF

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ninja-companion.yml"
      - "scripts/generate_ninja.py"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate polished running ninja banner
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_ninja.py

      - name: Commit GIF into the profile repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ninja-pixel-patrol.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh running ninja animation"
            git pull --rebase origin main
            git push
          fi
